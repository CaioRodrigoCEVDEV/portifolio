<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050A07">
  <meta name="robots" content="noindex, follow">
  <title>Página não encontrada — Caio Rodrigo</title>
  <meta name="description" content="A página que você procura não foi encontrada.">
  <link rel="canonical" href="https://caiorodrigocev.com.br/404">

  <meta property="og:type" content="website">
  <meta property="og:title" content="404 — Página não encontrada">
  <meta property="og:url" content="https://caiorodrigocev.com.br/404">
  <meta name="twitter:card" content="summary">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>

  <header class="site-header is-scrolled">
    <div class="container">
      <a href="/" class="brand" aria-label="Caio Rodrigo — Início">
        <span class="logo-wrapper" aria-hidden="true">
          <img src="/logo.png?v=3" alt="Caio Rodrigo Logo" class="navbar-logo">
        </span>
        <span>Caio Rodrigo</span>
      </a>
      <a href="/" class="btn btn-ghost btn-sm">
        <i class="bi bi-house" aria-hidden="true"></i>
        Início
      </a>
    </div>
  </header>

  <main>
    <section class="error-page">
      <div class="container">
        <div class="reveal">
          <div class="code">404</div>
          <h1>Página não encontrada</h1>
          <p>O link que você procura pode ter sido movido ou não existe mais.</p>
          <a href="/" class="btn btn-primary">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
            Voltar ao portfólio
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>© <span id="year"></span> Caio Rodrigo.</span>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
  <script src="/assets/js/main.js" defer></script>

</body>
</html>
